name: ci

on:
  push:
    branches: [main]
  pull_request:

# The kit never contains es-labs code. CI proves the same thing the VM bootstrap does: clone the two
# templates at their pinned commits, apply the patches and the overlay, and everything still builds.
jobs:
  patches-and-frontend:
    runs-on: ubuntu-latest
    env:
      EXPRESS_TEMPLATE_COMMIT: db883cd
      VUE_TEMPLATE_COMMIT: 99a34fa
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: kit
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - name: npm cache (templates at their pinned commits, kit unit + e2e)
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ env.EXPRESS_TEMPLATE_COMMIT }}-${{ env.VUE_TEMPLATE_COMMIT }}-${{ hashFiles('kit/web-techtest/unit/package-lock.json', 'kit/e2e/package.json') }}
          restore-keys: npm-${{ runner.os }}-

      - name: Shell scripts are valid and LF
        run: |
          for f in kit/patches/apply.sh kit/web-techtest/apply.sh kit/cloud/bootstrap.sh; do bash -n "$f"; done
          ! grep -rl $'\r' kit --include='*.sh' --include='*.service' --include='*.js' --include='*.mjs' --include='*.vue'

      - name: Unit tests for the overlay modules (session, TaskPulse client, socket bus)
        run: |
          cd kit/web-techtest/unit && npm ci --no-audit --no-fund --loglevel=error && npm run coverage
          node -e 'const s=require("./coverage/coverage-summary.json").total; const line=`### Frontend unit coverage: **${s.lines.pct}%** lines, ${s.functions.pct}% functions (session.js, taskpulse.js, users.js, shortcuts.js)`; console.log(line); require("fs").appendFileSync(process.env.GITHUB_STEP_SUMMARY, line + "\n")'

      - name: Clone es-labs/express-template at the pinned commit
        run: |
          git clone -q https://github.com/es-labs/express-template.git
          git -C express-template checkout -q "$EXPRESS_TEMPLATE_COMMIT"
      - name: Apply backend patches (idempotent, must not conflict)
        run: |
          bash kit/patches/apply.sh "$PWD/express-template"
          bash kit/patches/apply.sh "$PWD/express-template" | grep -c already
          cd express-template && npm i --no-audit --no-fund --loglevel=error && node --check apps/sample-api/src/routes/auth.js
      - name: Backend migrations run on PGlite (api_role, kit migration)
        run: |
          cd express-template/scripts/dbdeploy && npm i --no-audit --no-fund --loglevel=error
          node --input-type=module -e "import {PGlite} from '@electric-sql/pglite'; const db=new PGlite('./db-sample/dev.db'); await db.exec(\"DO \$\$ BEGIN IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname='api_role') THEN CREATE ROLE api_role; END IF; END \$\$\"); await db.close();"
          cp "$GITHUB_WORKSPACE"/kit/migrations/*.js db-sample/migrations/
          npx knex --knexfile db-sample/knexfile.js migrate:latest | tail -2

      - name: Clone es-labs/vue-antd-template at the pinned commit
        run: |
          git clone -q https://github.com/es-labs/vue-antd-template.git
          git -C vue-antd-template checkout -q "$VUE_TEMPLATE_COMMIT"
          cd vue-antd-template && npm i --no-audit --no-fund --loglevel=error && cd apps && npm i --no-audit --no-fund --loglevel=error
      - name: Apply the web-techtest overlay and build for production
        run: |
          bash kit/web-techtest/apply.sh "$PWD/vue-antd-template"
          cd vue-antd-template/apps
          printf 'VITE_SENTRY_DSN=\nVITE_API_URL=\nVITE_WITH_CREDENTIALS=same-origin\nVITE_WS_URL=\nVITE_WS_MS=5000\nBASE_PATH=/\nVITE_REFRESH_URL=/api/auth/refresh\nVITE_LOGOUT_URL=/api/auth/logout\nVITE_TASKPULSE_URL=https://taskpulse.example\n' > web-techtest/envs/.env.cloud
          npx vite build --config web-techtest/vite.config.js --mode cloud --logLevel error
          test -f web-techtest/dist/index.html
          grep -rq "taskpulse.example" web-techtest/dist/assets/
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: web-techtest-dist
          path: vue-antd-template/apps/web-techtest/dist

  # The full stack in the browser: TaskPulse (part B) from its compose file, express-template + PGlite with the kit's
  # patches, the overlay on the Vite dev server, then e2e/run.sh with headless Chrome - the same suite the demo box runs.
  browser-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      EXPRESS_TEMPLATE_COMMIT: db883cd
      VUE_TEMPLATE_COMMIT: 99a34fa
      JWT: ci-only-jwt-secret-shared-by-express-and-taskpulse-48
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: kit
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - name: npm cache (templates at their pinned commits, kit unit + e2e)
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ env.EXPRESS_TEMPLATE_COMMIT }}-${{ env.VUE_TEMPLATE_COMMIT }}-${{ hashFiles('kit/web-techtest/unit/package-lock.json', 'kit/e2e/package.json') }}
          restore-keys: npm-${{ runner.os }}-

      - name: TaskPulse (part B) - docker compose, seeded
        run: |
          git clone -q --depth 1 https://github.com/Fanani23/taskpulse.git
          cd taskpulse
          TASKPULSE_JWT_SECRET="$JWT" TASKPULSE_ALLOWED_ORIGIN=http://127.0.0.1:8080 docker compose up -d --build --quiet-pull
          for i in $(seq 1 90); do curl -fs http://127.0.0.1:8088/health/ready >/dev/null 2>&1 && break; sleep 2; done
          curl -fs http://127.0.0.1:8088/health/ready
          TASKPULSE_JWT_SECRET="$JWT" bash scripts/seed.sh http://127.0.0.1:8088 | tail -3

      - name: express-template (part A) - patches, PGlite, seeds, demo accounts, API on :3000
        run: |
          git clone -q https://github.com/es-labs/express-template.git
          git -C express-template checkout -q "$EXPRESS_TEMPLATE_COMMIT"
          bash kit/patches/apply.sh "$PWD/express-template" | tail -2
          cd express-template && npm i --no-audit --no-fund --loglevel=error
          cd scripts/dbdeploy && npm i --no-audit --no-fund --loglevel=error
          node --input-type=module -e "import {PGlite} from '@electric-sql/pglite'; const db=new PGlite('./db-sample/dev.db'); await db.exec(\"DO \$\$ BEGIN IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname='api_role') THEN CREATE ROLE api_role; END IF; END \$\$\"); await db.close();"
          cp "$GITHUB_WORKSPACE"/kit/migrations/*.js db-sample/migrations/
          npx knex --knexfile db-sample/knexfile.js migrate:latest | tail -1
          for f in initial_users.js initial_rbac.js initial_testdata.js; do npx knex --knexfile db-sample/knexfile.js seed:run --specific=$f | tail -1; done
          cp "$GITHUB_WORKSPACE/kit/patches/seed-demo-accounts.mjs" . && node seed-demo-accounts.mjs
          cd ../../apps/sample-api
          sed -i "s|^JWT_SECRET=.*|JWT_SECRET=$JWT|; s/^USE_OTP=.*/USE_OTP=EMAIL/" .env
          grep -q '"COOKIE_HTTPONLY"' .env.json || sed -i 's/^  "JWT": {$/  "JWT": {\n    "COOKIE_HTTPONLY": true,/' .env.json
          sed -i 's/^    "maxAge": 0, \/\/ no expiry.*/    "maxAge": 86400000,/' .env.json
          cd ../../scripts/dbdeploy && (nohup node serve-db.js > /tmp/vt-db.log 2>&1 &) && sleep 3
          cd ../../apps/sample-api && (NODE_ENV=development npm_package_name=@express-template/sample-api npm_package_version=0.0.6 nohup node src/index.js > /tmp/vt-api.log 2>&1 &)
          for i in $(seq 1 30); do curl -fs http://127.0.0.1:3000/api/auth/providers >/dev/null 2>&1 && break; sleep 2; done
          curl -fs http://127.0.0.1:3000/api/auth/providers

      - name: vue-antd-template + overlay - Vite dev server on :8080
        run: |
          git clone -q https://github.com/es-labs/vue-antd-template.git
          git -C vue-antd-template checkout -q "$VUE_TEMPLATE_COMMIT"
          cd vue-antd-template && npm i --no-audit --no-fund --loglevel=error && cd apps && npm i --no-audit --no-fund --loglevel=error
          bash "$GITHUB_WORKSPACE/kit/web-techtest/apply.sh" "$GITHUB_WORKSPACE/vue-antd-template" | tail -1
          (nohup npx vite --config web-techtest/vite.config.js --mode development > /tmp/vt-fe.log 2>&1 &)
          for i in $(seq 1 30); do curl -fs http://127.0.0.1:8080/signin >/dev/null 2>&1 && break; sleep 2; done
          curl -fs -o /dev/null http://127.0.0.1:8080/signin

      - name: Browser e2e (pages, session, dashboard, live, axe)
        run: |
          cd kit/e2e && npm i --no-audit --no-fund --loglevel=error
          E2E_CHROME="$(command -v google-chrome || command -v chromium-browser)" bash run.sh

      - name: Logs on failure
        if: failure()
        run: |
          echo "== vt-api"; tail -60 /tmp/vt-api.log || true
          echo "== vt-fe"; tail -30 /tmp/vt-fe.log || true
          echo "== vt-db"; tail -20 /tmp/vt-db.log || true
          echo "== taskpulse"; (cd taskpulse && docker compose logs --tail 60) || true
